<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Không tìm thấy trang — 14 kỳ Đại hội Đảng</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F6F1E7; color: #2B2320;
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px; }
    b { display: block; font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: clamp(6rem, 22vw, 11rem); line-height: .9; color: #7A1F16; }
    p { font-size: 1.1rem; margin: 1rem 0 1.75rem; }
    a { display: inline-block; padding: .85em 1.4em; border-radius: 999px; background: #7A1F16; color: #FBF3E4; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <b>404</b>
    <p>Không tìm thấy trang bạn cần.</p>
    <a id="home" href="/">Về trang chủ 14 kỳ Đại hội</a>
  </main>
  <script>
    // Trên GitHub Pages dạng dự án, trang chủ nằm ở /ten-repo/
    if (/\.github\.io$/.test(location.hostname)) {
      var seg = location.pathname.split('/')[1];
      if (seg) document.getElementById('home').href = '/' + seg + '/';
    }
  </script>
</body>
</html>
